[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-repository-auditing-agent"
version = "1.0.0"
description = "Evidence-driven LLM tool loop for read-only DevOps repository audits"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devops-audit = "agent:main"

[tool.setuptools]
py-modules = ["agent", "tools"]

[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".validation-deps", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
